<!-- 放在 </body> 前 -->
<div id="ttsBar" style="position:fixed;bottom:20px;right:20px;background:#1e212b;padding:10px 12px;border-radius:12px;display:none;align-items:center;gap:8px;">
  <button id="ttsBtn">🔊 朗读</button>
  <select id="ttsRate">
    <option value="0.8">0.8x</option>
    <option value="1" selected>1x</option>
    <option value="1.2">1.2x</option>
  </select>
  <span id="ttsStatus"></span>
</div>

<script>
let ttsPlaying = false;
let ttsPaused = false;
let ttsChunks = [];
let ttsChunkIndex = 0;

function initTTS() {
  if (!('speechSynthesis' in window)) return;
  const el = document.querySelector('.episode') || document.querySelector('.container');
  if (!el) return;
  const text = el.innerText.trim();
  if (text.length < 50) return;
  ttsChunks = text.match(/[^。！？；\n]+[。！？；\n]?/g) || [text];
  document.getElementById('ttsBar').style.display = 'flex';
}

function speakNextChunk() {
  if (ttsChunkIndex >= ttsChunks.length) {
    ttsPlaying = false; ttsPaused = false;
    document.getElementById('ttsBtn').textContent = '🔊 朗读';
    document.getElementById('ttsStatus').textContent = '朗读完毕';
    return;
  }
  const u = new SpeechSynthesisUtterance(ttsChunks[ttsChunkIndex]);
  u.lang = 'zh-CN';
  u.rate = parseFloat(document.getElementById('ttsRate').value);
  u.onend = () => { ttsChunkIndex++; speakNextChunk(); };
  u.onerror = () => { ttsChunkIndex++; speakNextChunk(); };
  speechSynthesis.speak(u);
  document.getElementById('ttsStatus').textContent =
    `正在朗读... (${ttsChunkIndex+1}/${ttsChunks.length})`;
}

document.getElementById('ttsBtn').onclick = () => {
  if (!ttsChunks.length) return;
  if (ttsPlaying && !ttsPaused) {
    speechSynthesis.pause(); ttsPaused=true; ttsPlaying=false;
    document.getElementById('ttsBtn').textContent='▶ 继续';
    document.getElementById('ttsStatus').textContent='已暂停';
  } else if (ttsPaused) {
    speechSynthesis.resume(); ttsPaused=false; ttsPlaying=true;
    document.getElementById('ttsBtn').textContent='⏸ 暂停';
    document.getElementById('ttsStatus').textContent='正在朗读...';
  } else {
    ttsChunkIndex=0; ttsPlaying=true; ttsPaused=false;
    document.getElementById('ttsBtn').textContent='⏸ 暂停';
    document.getElementById('ttsStatus').textContent='正在朗读...';
    speakNextChunk();
  }
};

document.getElementById('ttsRate').onchange = (e) => {
  if (ttsPlaying && !ttsPaused) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ttsChunks[ttsChunkIndex]);
    u.lang = 'zh-CN'; u.rate = parseFloat(e.target.value);
    u.onend = () => { ttsChunkIndex++; speakNextChunk(); };
    u.onerror = () => { ttsChunkIndex++; speakNextChunk(); };
    speechSynthesis.speak(u);
  }
};

window.addEventListener('DOMContentLoaded', () => setTimeout(initTTS, 500));
</script>
